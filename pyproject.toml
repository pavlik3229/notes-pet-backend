[project]
name = "ailearn"
version = "0.1.0"
description = ""
authors = [
    {name = "pavlik3229",email = "147932271+pavlik3229@users.noreply.github.com"}
]
requires-python =  ">=3.14,<4.0.0"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "elasticsearch (>=9.4.1,<10.0.0)",
    "aiohttp (>=3.14.0,<4.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "google-genai (>=2.8.0,<3.0.0)",
    "langchain-google-genai (>=4.2.4,<5.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "strawberry-graphql[cli] (>=0.316.0,<0.317.0)",
    "langchain-core (>=1.4.8,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[dependency-groups]
dev = [
    "pre-commit (>=4.6.0,<5.0.0)",
    "notebook (>=7.5.6,<8.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "alembic",
]
[tool.ruff.format]
quote-style = "single"

